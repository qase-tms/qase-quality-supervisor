name: Validate plugin

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'smoke (PR-sized) or full (both arms, three runs)'
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read

# A new push to the same ref supersedes any run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Manifest validation, the secrets scan, and the hook unit tests. These need
  # no authenticated Claude Code session, so this job is the blocking gate.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # First, and before the toolchain: this needs nothing but bash and sed, and
      # it guards a failure that is invisible everywhere else — a stale
      # X-Qase-Integration version is reported to Qase analytics and still passes
      # the MCP server's validation, so nothing downstream ever complains. Its own
      # step so a mismatch reads as a version problem in the checks list instead of
      # a generic "static checks failed". Also run inside verify-plugin.sh, which
      # is what local runs and the install job use.
      - name: Version strings agree (manifests, integration marker, README)
        run: bash scripts/check-version-sync.sh

      - name: Version tooling tests
        run: bash tests/test-version-sync.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned: the install job's inventory assertions grep this CLI's
      # human-readable `plugin details` output, which is not a stable API.
      # Bump deliberately, re-checking those assertions.
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.221

      - name: Static checks
        run: bash scripts/verify-plugin.sh --static-only

  # The marketplace-add -> install -> `plugin details` inventory assertions.
  # Confirmed working on GitHub's runners without an authenticated Claude Code
  # session (run 31681253740), so this job is blocking like `static`.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.221

      - name: Full verification (install + component inventory)
        run: bash scripts/verify-plugin.sh

  # The eval suite bills real money on every run, and a change to the README, the
  # changelog or a shell test cannot move a single grader. This job decides whether
  # the pull request touches anything that could, so documentation-only work stops
  # paying for a sweep.
  #
  # The list below is deliberately wide. A path missing from it buys a silent gap
  # in behaviour coverage; a path that did not need to be on it costs one run.
  behaviour-changed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison needs both ends of the pull request, not just its tip.
          fetch-depth: 0

      - id: filter
        name: Can this change how the plugin behaves?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Anything that is not a pull request — a manual dispatch above all —
          # asked for the suite in so many words and gets it.
          if [ "$EVENT" != "pull_request" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE...$HEAD")"
          printf 'Changed in this pull request:\n%s\n\n' "$changed"

          if printf '%s\n' "$changed" | grep -qE '^(skills|commands|agents|hooks|evals|references)/|^\.claude-plugin/|^\.mcp\.json$|^scripts/run-evals\.sh$|^\.github/workflows/validate\.yml$'; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "A behaviour-relevant path changed; the eval suite will run."
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "Nothing here can change how the plugin behaves; skipping the eval suite."
          fi

  # Behaviour, not shape: does the plugin route a natural request to the right
  # skill and finish the analysis. Needs an authenticated CLI, so it is skipped
  # for pull requests from forks, which have no access to the secret, and for
  # pull requests that change nothing the suite could measure.
  evals:
    needs: behaviour-changed
    if: >-
      needs.behaviour-changed.outputs.any == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Only this job writes, and only to a pull request's comments, to report what
    # the suite found. The workflow-wide default stays read-only for everything
    # else. Forks never reach here, so the token always has the write it needs.
    permissions:
      contents: read
      pull-requests: write
    # The `full` scope this job offers (both arms, three runs) measured 1h45m
    # end to end; 30 minutes could not finish it. 150 gives that headroom with
    # margin. The default `smoke` path (a pull request, no explicit scope) is
    # PR-sized and finishes in a fraction of this — this ceiling only matters
    # when `full` is chosen via workflow_dispatch.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned separately from the other jobs: `plugin eval` needs 2.1.269+,
      # which the 2.1.221 they pin predates.
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.276

      - name: Run the eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.scope }}" = "full" ]; then
            bash scripts/run-evals.sh
          else
            bash scripts/run-evals.sh --smoke
          fi

      # A red check says the suite failed; this says which case fell over and
      # which grader said so, in the pull request itself. It runs even when the
      # suite died, because that is when a reviewer most needs to be told
      # something — and it never fails the job, since a run that cannot report
      # its own failure reports nothing at all.
      - name: Report back to the pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          agg="$(ls -t evals/results/*/aggregate-result.json 2>/dev/null | head -1)"
          bash scripts/eval-comment.sh "$agg" "$RUN_URL" > comment.md
          cat comment.md

          # One comment per pull request, edited in place: a sweep runs on every
          # behaviour change, and a fresh comment each time would bury the thread.
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- eval-report -->"))) | .[0].id // empty')"

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/results/
          retention-days: 14
